<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pennino Active Projects Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 320px; min-width: 260px; display: flex; flex-direction: column; background: #1e1e2e; color: #cdd6f4; border-right: 1px solid #313244; z-index: 1000; }
  #sidebar-header { padding: 12px 14px; background: #181825; border-bottom: 1px solid #313244; }
  #sidebar-header h2 { font-size: 15px; font-weight: 700; color: #cba6f7; margin-bottom: 8px; }
  #search-row { display: flex; gap: 6px; }
  #search-input { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; font-size: 13px; outline: none; }
  #search-input:focus { border-color: #cba6f7; }
  #goto-btn { padding: 7px 10px; border-radius: 6px; border: none; background: #cba6f7; color: #1e1e2e; font-size: 13px; cursor: pointer; white-space: nowrap; font-weight: 600; }
  #goto-btn:hover { background: #b4befe; }
  #filters { padding: 10px 14px; background: #181825; border-bottom: 1px solid #313244; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-label { font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .filter-label input { cursor: pointer; accent-color: #cba6f7; }
  .tier-t1 { color: #89b4fa; }
  .tier-t2 { color: #a6e3a1; }
  .tier-t3 { color: #fab387; }
  #project-list { flex: 1; overflow-y: auto; padding: 8px 6px; }
  #project-list::-webkit-scrollbar { width: 5px; }
  #project-list::-webkit-scrollbar-track { background: #1e1e2e; }
  #project-list::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
  .proj-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 3px; border: 1px solid transparent; transition: all 0.15s; }
  .proj-item:hover { background: #313244; border-color: #45475a; }
  .proj-item.active { background: #2a273f; border-color: #cba6f7; }
  .proj-name { font-size: 12px; font-weight: 600; color: #cdd6f4; line-height: 1.3; }
  .proj-meta { font-size: 11px; color: #6c7086; margin-top: 2px; line-height: 1.3; }
  .tier-badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 700; margin-right: 4px; }
  .badge-T1 { background: #1e3a5f; color: #89b4fa; }
  .badge-T2 { background: #1a3a2a; color: #a6e3a1; }
  .badge-T3 { background: #3a2a1a; color: #fab387; }
  .status-tag { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .st-active { background: #1a3a2a; color: #a6e3a1; }
  .st-completed { background: #1a2a3a; color: #89b4fa; }
  .st-cancelled { background: #3a3a1a; color: #f9e2af; }
  .st-abandoned { background: #3a1a1a; color: #f38ba8; }
  .st-deferred { background: #2a1a3a; color: #cba6f7; }
  #statusbar { padding: 8px 14px; background: #181825; border-top: 1px solid #313244; font-size: 11px; color: #6c7086; }
  #map { flex: 1; }
  .office-star { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); cursor: default; }
  #logo-ctrl { position: absolute; top: 10px; right: 50px; z-index: 999; pointer-events: none; }
  #logo-ctrl img { width: 120px; opacity: 0.85; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); }
  /* Popup styling */
  .leaflet-popup-content { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; min-width: 220px; }
  .popup-name { font-weight: 700; font-size: 14px; margin-bottom: 5px; }
  .popup-addr { color: #555; font-size: 12px; margin-bottom: 6px; }
  .popup-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .popup-stage { font-size: 11px; color: #777; margin-bottom: 6px; }
  .popup-link { display: inline-block; font-size: 12px; color: #2196F3; text-decoration: none; }
  .popup-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>🗺 Pennino Projects</h2>
    <div id="search-row">
      <input type="text" id="search-input" placeholder="Search name or address..." />
      <button id="goto-btn" title="Geocode and go to address">📍 Go</button>
    </div>
  </div>
  <div id="filters">
    <label class="filter-label">
      <input type="checkbox" id="active-only" checked> Active Only
    </label>
    <label class="filter-label tier-t1">
      <input type="checkbox" id="tier-t1" checked> T1 <span id="cnt-t1">(0)</span>
    </label>
    <label class="filter-label tier-t2">
      <input type="checkbox" id="tier-t2" checked> T2 <span id="cnt-t2">(0)</span>
    </label>
    <label class="filter-label tier-t3">
      <input type="checkbox" id="tier-t3" checked> T3 <span id="cnt-t3">(0)</span>
    </label>
  </div>
  <div id="project-list"></div>
  <div id="statusbar">Loading...</div>
</div>
<div id="map"></div>

var ACTIVE_STATUSES = new Set(['IN PROGRESS', 'NOT STARTED', 'DEFERRED']);

function statusClass(s) {
  if (ACTIVE_STATUSES.has(s)) return 'st-active';
  if (s === 'COMPLETED') return 'st-completed';
  if (s === 'CANCELLED') return 'st-cancelled';
  if (s === 'ABANDONED') return 'st-abandoned';
  if (s === 'DEFERRED') return 'st-deferred';
  return 'st-active';
}

// Map init
var map = L.map('map', { center: [-34.92, 138.60], zoom: 10 });

var layers = {
  'Street': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
  'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' }),
  'Topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' }),
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© CartoDB' })
};
layers['Street'].addTo(map);
L.control.layers(layers).addTo(map);

var tierColors = { T1: '#2196F3', T2: '#4CAF50', T3: '#FF9800' };

function makeMarker(p) {
  var color = tierColors[p.tier] || '#888';
  var icon = L.divIcon({
    html: '<div style="width:14px;height:14px;border-radius:50%;background:' + color + ';border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>',
    className: '',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -10]
  });
  var statusCls = statusClass(p.status);
  var isActive = ACTIVE_STATUSES.has(p.status);
  var popup = '<div class="popup-name">' + escHtml(p.name) + '</div>'
    + (p.address ? '<div class="popup-addr">📍 ' + escHtml(p.address) + '</div>' : '')
    + '<div class="popup-meta"><span class="tier-badge badge-' + p.tier + '">' + p.tier + '</span>'
    + '<span class="status-tag ' + statusCls + '">' + p.status + '</span></div>'
    + (p.stage ? '<div class="popup-stage">Stage: ' + escHtml(p.stage) + '</div>' : '')
    + '<a class="popup-link" href="https://crm.na1.insightly.com/details/project/' + p.id + '" target="_blank">Open in Insightly →</a>';
  return L.marker([p.lat, p.lng], { icon: icon }).bindPopup(popup);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Cluster groups per tier
var clusterGroups = {
  T1: L.markerClusterGroup({ maxClusterRadius: 60, iconCreateFunction: function(cluster) {
    return L.divIcon({ html: '<div style="background:#2196F3;color:white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">' + cluster.getChildCount() + '</div>', className: '', iconSize:[34,34], iconAnchor:[17,17] });
  } }),
  T2: L.markerClusterGroup({ maxClusterRadius: 60, iconCreateFunction: function(cluster) {
    return L.divIcon({ html: '<div style="background:#4CAF50;color:white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">' + cluster.getChildCount() + '</div>', className: '', iconSize:[34,34], iconAnchor:[17,17] });
  } }),
  T3: L.markerClusterGroup({ maxClusterRadius: 60, iconCreateFunction: function(cluster) {
    return L.divIcon({ html: '<div style="background:#FF9800;color:white;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">' + cluster.getChildCount() + '</div>', className: '', iconSize:[34,34], iconAnchor:[17,17] });
  } })
};

var projects = rawData.map(function(r) {
  return { id: r[0], name: r[1], address: r[2], tier: r[3], stage: r[4], status: r[5], lat: r[6], lng: r[7] };
});

var searchPin = null;

function applyFilters() {
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  var activeOnly = document.getElementById('active-only').checked;
  var showT1 = document.getElementById('tier-t1').checked;
  var showT2 = document.getElementById('tier-t2').checked;
  var showT3 = document.getElementById('tier-t3').checked;

  // Clear cluster groups
  Object.values(clusterGroups).forEach(function(cg) { cg.clearLayers(); if (map.hasLayer(cg)) map.removeLayer(cg); });

  var tierShown = { T1: showT1, T2: showT2, T3: showT3 };
  var cntT1 = 0, cntT2 = 0, cntT3 = 0;
  var filtered = [];

  projects.forEach(function(p) {
    if (activeOnly && !ACTIVE_STATUSES.has(p.status)) return;
    if (!tierShown[p.tier]) return;
    if (q && !(p.name.toLowerCase().includes(q) || (p.address && p.address.toLowerCase().includes(q)))) return;
    filtered.push(p);
    if (p.tier === 'T1') cntT1++;
    else if (p.tier === 'T2') cntT2++;
    else cntT3++;
  });

  // Add markers to cluster groups
  filtered.forEach(function(p) {
    var m = makeMarker(p);
    m._projId = p.id;
    clusterGroups[p.tier].addLayer(m);
  });

  // Add visible cluster groups to map
  if (showT1) clusterGroups.T1.addTo(map);
  if (showT2) clusterGroups.T2.addTo(map);
  if (showT3) clusterGroups.T3.addTo(map);

  document.getElementById('cnt-t1').textContent = '(' + cntT1 + ')';
  document.getElementById('cnt-t2').textContent = '(' + cntT2 + ')';
  document.getElementById('cnt-t3').textContent = '(' + cntT3 + ')';

  var total = cntT1 + cntT2 + cntT3;
  document.getElementById('statusbar').textContent = total + ' pins visible' + (activeOnly ? ' (active only)' : '');

  // Update list
  var listEl = document.getElementById('project-list');
  listEl.innerHTML = '';
  filtered.slice(0, 200).forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'proj-item';
    div.dataset.id = p.id;
    var statusCls = statusClass(p.status);
    div.innerHTML = '<div class="proj-name">' + escHtml(p.name) + '</div>'
      + '<div class="proj-meta">'
      + '<span class="tier-badge badge-' + p.tier + '">' + p.tier + '</span>'
      + '<span class="status-tag ' + statusCls + '">' + p.status + '</span>'
      + (p.address ? ' &bull; ' + escHtml(p.address) : '')
      + '</div>';
    div.addEventListener('click', function() {
      map.setView([p.lat, p.lng], 16);
      // Find marker and open popup
      var found = null;
      clusterGroups[p.tier].eachLayer(function(lyr) { if (lyr._projId === p.id) found = lyr; });
      if (found) {
        clusterGroups[p.tier].zoomToShowLayer(found, function() { found.openPopup(); });
      }
      document.querySelectorAll('.proj-item').forEach(function(el) { el.classList.remove('active'); });
      div.classList.add('active');
    });
    listEl.appendChild(div);
  });
  if (filtered.length > 200) {
    var more = document.createElement('div');
    more.style.cssText = 'text-align:center;padding:8px;font-size:11px;color:#6c7086';
    more.textContent = '+ ' + (filtered.length - 200) + ' more (refine search)';
    listEl.appendChild(more);
  }
}

// Event listeners
document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('active-only').addEventListener('change', applyFilters);
document.getElementById('tier-t1').addEventListener('change', applyFilters);
document.getElementById('tier-t2').addEventListener('change', applyFilters);
document.getElementById('tier-t3').addEventListener('change', applyFilters);

document.getElementById('search-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') geocodeSearch();
});
document.getElementById('goto-btn').addEventListener('click', geocodeSearch);

function geocodeSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  var encoded = encodeURIComponent(q + ', South Australia, Australia');
  var url = 'https://maps.googleapis.com/maps/api/geocode/json?address=' + encoded + '&key=' + GOOGLE_API_KEY;
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    if (data.status === 'OK' && data.results.length) {
      var loc = data.results[0].geometry.location;
      map.setView([loc.lat, loc.lng], 14);
      if (searchPin) map.removeLayer(searchPin);
      searchPin = L.marker([loc.lat, loc.lng], {
        icon: L.divIcon({ html: '<div style="color:#f38ba8;font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">📍</div>', className: '', iconSize:[28,34], iconAnchor:[14,34] })
      }).addTo(map).bindPopup('<strong>' + escHtml(data.results[0].formatted_address) + '</strong>').openPopup();
    } else {
      alert('Address not found: ' + q);
    }
  }).catch(function(e) { console.error('Geocode error', e); });
}

applyFilters();

</script>
