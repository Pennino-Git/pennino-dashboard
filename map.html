<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pennino Active Projects Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#map{position:absolute;top:0;left:320px;right:0;bottom:40px}
#sidebar{position:absolute;top:0;left:0;width:320px;bottom:40px;background:#fff;overflow-y:auto;border-right:2px solid #ddd;z-index:1000}
#stats-bar{position:absolute;bottom:0;left:0;right:0;height:40px;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:1000}
.sidebar-header{padding:15px;background:#1a1a2e;color:#fff}
.sidebar-header h2{font-size:16px;margin-bottom:10px}
.search-container{display:flex;gap:5px;margin-bottom:10px}
.search-container input{flex:1;padding:8px;border:none;border-radius:4px;font-size:13px}
.search-container button{padding:8px 12px;background:#2196F3;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.search-container button:hover{background:#1976D2}
.filters{padding:10px 15px;background:#f5f5f5;border-bottom:1px solid #ddd}
.filter-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.filter-row input[type="checkbox"]{cursor:pointer}
.filter-row label{cursor:pointer}
.tier-badge{display:inline-block;padding:2px 8px;border-radius:10px;color:#fff;font-size:11px;font-weight:bold}
.tier-t1{background:#2196F3}
.tier-t2{background:#4CAF50}
.tier-t3{background:#FF9800}
.project-list{padding:0}
.project-item{padding:10px 15px;border-bottom:1px solid #eee;cursor:pointer;transition:background 0.2s}
.project-item:hover{background:#f0f7ff}
.project-item .name{font-weight:600;font-size:13px;color:#333}
.project-item .address{font-size:12px;color:#666;margin-top:2px}
.project-item .meta{display:flex;gap:6px;margin-top:4px;align-items:center}
.status-tag{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;text-transform:uppercase}
.status-active{background:#e8f5e9;color:#2e7d32}
.status-completed{background:#e3f2fd;color:#1565c0}
.status-cancelled{background:#fff8e1;color:#f57f17}
.status-abandoned{background:#fce4ec;color:#c62828}
.status-deferred{background:#f3e5f5;color:#7b1fa2}
.logo-container{position:absolute;top:10px;right:10px;z-index:1000;pointer-events:none}
.logo-container img{width:120px;opacity:0.85}
</style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-header">
    <h2>📍 Pennino Projects</h2>
    <div class="search-container">
      <input type="text" id="search" placeholder="Search name or address..."/>
      <button onclick="geocodeSearch()">📍 Go</button>
    </div>
  </div>
  <div class="filters">
    <div class="filter-row">
      <input type="checkbox" id="activeOnly" checked onchange="applyFilters()"/>
      <label for="activeOnly"><strong>Active Jobs Only</strong></label>
    </div>
    <div class="filter-row">
      <input type="checkbox" id="tierT1" checked onchange="applyFilters()"/>
      <label for="tierT1"><span class="tier-badge tier-t1">T1</span> <span id="countT1">0</span></label>
    </div>
    <div class="filter-row">
      <input type="checkbox" id="tierT2" checked onchange="applyFilters()"/>
      <label for="tierT2"><span class="tier-badge tier-t2">T2</span> <span id="countT2">0</span></label>
    </div>
    <div class="filter-row">
      <input type="checkbox" id="tierT3" checked onchange="applyFilters()"/>
      <label for="tierT3"><span class="tier-badge tier-t3">T3</span> <span id="countT3">0</span></label>
    </div>
  </div>
  <div id="project-list" class="project-list"></div>
</div>
<div id="map"></div>
<div id="stats-bar">Loading...</div>

const TIER_COLORS = {"T1":"#2196F3","T2":"#4CAF50","T3":"#FF9800"};
const ACTIVE_STATUSES = ["IN PROGRESS","NOT STARTED","DEFERRED"];

const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap',maxZoom:19});
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'© Esri',maxZoom:19});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution:'© OpenTopoMap',maxZoom:17});
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'© CartoDB',maxZoom:19});

const map = L.map('map', {center:[-34.92,138.60], zoom:10, layers:[street]});
L.control.layers({"Street":street,"Satellite":satellite,"Topo":topo,"Dark":dark}).addTo(map);

function makeCluster(color) {
  return L.markerClusterGroup({
    maxClusterRadius: 50,
    iconCreateFunction: function(cluster) {
      return L.divIcon({
        html: '<div style="background:'+color+';color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">'+cluster.getChildCount()+'</div>',
        className: '',
        iconSize: [36, 36]
      });
    }
  });
}

const clusterGroups = {
  T1: makeCluster('#2196F3'),
  T2: makeCluster('#4CAF50'),
  T3: makeCluster('#FF9800')
};
Object.values(clusterGroups).forEach(function(g){map.addLayer(g)});

let markers = [];
let searchMarker = null;

function getStatusClass(s) {
  if(ACTIVE_STATUSES.includes(s)) return 'status-active';
  if(s==='COMPLETED') return 'status-completed';
  if(s==='CANCELLED') return 'status-cancelled';
  if(s==='ABANDONED') return 'status-abandoned';
  return 'status-deferred';
}

function getStatusLabel(s) {
  if(ACTIVE_STATUSES.includes(s)) return 'Active';
  return s.charAt(0)+s.slice(1).toLowerCase();
}

function escapeHtml(t) {
  if(!t) return '';
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function createMarker(p) {
  var color = TIER_COLORS[p.tier] || '#FF9800';
  var m = L.circleMarker([p.lat, p.lng], {
    radius: 7, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.9
  });
  var sc = getStatusClass(p.status);
  m.bindPopup(
    '<div style="min-width:200px">' +
    '<h3 style="margin:0 0 5px;font-size:14px;">'+escapeHtml(p.project_name)+'</h3>' +
    '<p style="margin:0 0 5px;font-size:12px;color:#666;">'+escapeHtml(p.address||'No address')+'</p>' +
    '<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px;">' +
    '<span class="tier-badge tier-'+p.tier.toLowerCase()+'">'+p.tier+'</span>' +
    '<span class="status-tag '+sc+'">'+p.status+'</span>' +
    '</div>' +
    '<p style="margin:0 0 5px;font-size:12px;"><strong>Stage:</strong> '+escapeHtml(p.stage_name)+'</p>' +
    '<a href="https://crm.na1.insightly.com/details/project/'+p.project_id+'" target="_blank" style="font-size:12px;color:#2196F3;">Open in Insightly →</a>' +
    '</div>'
  );
  m._projectData = p;
  return m;
}

function applyFilters() {
  var activeOnly = document.getElementById('activeOnly').checked;
  var showT1 = document.getElementById('tierT1').checked;
  var showT2 = document.getElementById('tierT2').checked;
  var showT3 = document.getElementById('tierT3').checked;
  var searchVal = document.getElementById('search').value.toLowerCase();

  Object.values(clusterGroups).forEach(function(g){g.clearLayers()});
  markers = [];

  var counts = {T1:0, T2:0, T3:0};
  var filtered = [];

  ALL_PROJECTS.forEach(function(p) {
    if(activeOnly && !ACTIVE_STATUSES.includes(p.status)) return;
    if(searchVal && !p.project_name.toLowerCase().includes(searchVal) && !(p.address||'').toLowerCase().includes(searchVal)) return;

    counts[p.tier] = (counts[p.tier]||0) + 1;
    var showTier = (p.tier==='T1'&&showT1)||(p.tier==='T2'&&showT2)||(p.tier==='T3'&&showT3);
    if(!showTier) return;

    var m = createMarker(p);
    clusterGroups[p.tier].addLayer(m);
    markers.push(m);
    filtered.push(p);
  });

  document.getElementById('countT1').textContent = counts.T1||0;
  document.getElementById('countT2').textContent = counts.T2||0;
  document.getElementById('countT3').textContent = counts.T3||0;

  var list = document.getElementById('project-list');
  list.innerHTML = filtered.map(function(p) {
    return '<div class="project-item" onclick="flyTo('+p.lat+','+p.lng+','+p.project_id+')">' +
      '<div class="name">'+escapeHtml(p.project_name)+'</div>' +
      '<div class="address">'+escapeHtml(p.address||'No address')+'</div>' +
      '<div class="meta">' +
      '<span class="tier-badge tier-'+p.tier.toLowerCase()+'">'+p.tier+'</span>' +
      '<span class="status-tag '+getStatusClass(p.status)+'">'+getStatusLabel(p.status)+'</span>' +
      '</div></div>';
  }).join('');

  document.getElementById('stats-bar').textContent = 'Showing '+filtered.length+' of '+ALL_PROJECTS.length+' projects';
}

function flyTo(lat, lng, pid) {
  map.setView([lat, lng], 16);
  markers.forEach(function(m) {
    if(m._projectData && m._projectData.project_id === pid) {
      var parent = clusterGroups[m._projectData.tier];
      var visibleParent = parent.getVisibleParent(m);
      if(visibleParent && visibleParent !== m && visibleParent.spiderfy) {
        visibleParent.spiderfy();
      }
      setTimeout(function(){m.openPopup()}, 300);
    }
  });
}

function geocodeSearch() {
  var q = document.getElementById('search').value;
  if(!q) return;
  fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q)+',+South+Australia,+Australia&key=AIzaSyCct1c7xCh5lGEdl875CaEPPIfOPe75tD0')
    .then(function(r){return r.json()}).then(function(d) {
      if(d.status==='OK') {
        var loc = d.results[0].geometry.location;
        if(searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([loc.lat, loc.lng], {
          icon: L.divIcon({html:'<div style="background:#f44336;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]})
        }).addTo(map).bindPopup('<b>Search:</b> '+d.results[0].formatted_address).openPopup();
        map.setView([loc.lat, loc.lng], 15);
      } else { alert('Location not found'); }
    }).catch(function(){alert('Geocoding failed')});
}

document.getElementById('search').addEventListener('keypress', function(e) {
  if(e.key==='Enter') {
    var q = this.value.toLowerCase();
    var hasMatch = ALL_PROJECTS.some(function(p){return p.project_name.toLowerCase().includes(q) || (p.address||'').toLowerCase().includes(q)});
    if(hasMatch) { applyFilters(); } else { geocodeSearch(); }
  }
});
document.getElementById('search').addEventListener('input', function() { applyFilters(); });

applyFilters();
</script>
