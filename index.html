<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pennino Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --t1:#3b82f6; --t2:#22c55e; --t3:#f59e0b;
  --bg:#0f172a; --surface:#1e293b; --surface2:#334155;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --border:#475569; --accent:#2D6DA5;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* Header */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.header-left { display:flex; align-items:center; gap:16px; }
.logo { height:36px; }
.header h1 { font-size:20px; font-weight:600; }
.header-right { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text2); }
.refresh-badge { background:var(--surface2); padding:4px 10px; border-radius:12px; font-size:11px; }

/* Nav */
.nav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; display:flex; gap:0; overflow-x:auto; }
.nav-tab { padding:10px 16px; font-size:13px; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap; flex-shrink:0; }
.nav-tab:hover { color:var(--text); background:var(--surface2); }
.nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.nav-tab .tab-badge { background:var(--red); color:#fff; font-size:9px; padding:1px 5px; border-radius:8px; margin-left:4px; font-weight:700; }

/* Filters */
.filters { padding:12px 24px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-btn { padding:5px 14px; border-radius:16px; font-size:12px; border:1px solid var(--border); background:transparent; color:var(--text2); cursor:pointer; transition:all .2s; }
.filter-btn:hover { border-color:var(--text2); color:var(--text); }
.filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.filter-sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
.search-box { margin-left:auto; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px; width:220px; }
.search-box::placeholder { color:var(--text3); }
.client-search-wrap { position:relative; }
.client-search { padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px; width:200px; }
.client-search::placeholder { color:var(--text3); }
.client-suggestions { position:absolute; top:100%; left:0; right:0; max-height:260px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:0 0 8px 8px; z-index:200; display:none; }
.client-suggestions.show { display:block; }
.client-sug-item { padding:6px 12px; font-size:13px; cursor:pointer; color:var(--text); }
.client-sug-item:hover, .client-sug-item.active { background:var(--accent); color:#fff; }
.client-sug-clear { padding:6px 12px; font-size:12px; cursor:pointer; color:var(--accent); border-bottom:1px solid var(--border); font-weight:600; }
.client-sug-clear:hover { background:var(--surface2); }

/* Stats bar */
.stats-bar { padding:12px 24px; display:flex; gap:12px; flex-wrap:wrap; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:100px; flex:1; }
.stat-card .label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; }
.stat-card .value { font-size:24px; font-weight:700; margin-top:2px; }
.stat-card .sub { font-size:11px; color:var(--text2); margin-top:2px; }

/* Workload Summary */
.workload-section { padding:0 24px 12px; }
.workload-toggle { font-size:12px; color:var(--accent); cursor:pointer; display:flex; align-items:center; gap:4px; margin-bottom:8px; user-select:none; }
.workload-toggle:hover { color:var(--text); }
.workload-chart { display:flex; gap:16px; flex-wrap:wrap; }
.workload-bars { flex:1; min-width:300px; }
.workload-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.workload-bar-label { font-size:12px; color:var(--text2); width:120px; text-align:right; flex-shrink:0; }
.workload-bar-track { flex:1; height:22px; background:var(--surface2); border-radius:4px; overflow:hidden; position:relative; }
.workload-bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px; font-size:11px; font-weight:600; color:#fff; min-width:24px; transition:width .3s; }
.workload-donut-wrap { width:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.workload-donut { position:relative; width:140px; height:140px; }
.workload-donut svg { transform:rotate(-90deg); }
.workload-donut-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
.workload-donut-center .big { font-size:28px; font-weight:700; }
.workload-donut-center .small { font-size:10px; color:var(--text3); }

/* Bottleneck bar */
.bottleneck { padding:0 24px 12px; }
.bottleneck-title { font-size:12px; color:var(--text3); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.bottleneck-bar { display:flex; height:28px; border-radius:6px; overflow:hidden; }
.bottleneck-seg { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; transition:all .3s; cursor:pointer; white-space:nowrap; overflow:hidden; }
.bottleneck-seg:hover { filter:brightness(1.2); }

/* Kanban */
.kanban { padding:12px 24px; display:flex; gap:12px; overflow-x:auto; align-items:flex-start; }
.kanban-col { min-width:260px; max-width:300px; flex:0 0 260px; background:var(--surface); border-radius:10px; border:1px solid var(--border); }
.kanban-col-header { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.kanban-col-title { font-size:13px; font-weight:600; }
.kanban-col-count { font-size:11px; background:var(--surface2); padding:2px 8px; border-radius:10px; color:var(--text2); }
.kanban-cards { padding:8px; max-height:calc(100vh - 320px); overflow-y:auto; display:flex; flex-direction:column; gap:6px; }

/* Cards */
.card { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:pointer; transition:all .15s; position:relative; }
.card:hover { border-color:var(--accent); transform:translateY(-1px); }
.card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:4px; }
.card-name { font-size:13px; font-weight:600; line-height:1.3; flex:1; }
.card-badges { display:flex; gap:3px; flex-shrink:0; align-items:center; }
.card-tier { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; }
.card-tier.T1 { background:var(--t1); color:#fff; }
.card-tier.T2 { background:var(--t2); color:#fff; }
.card-tier.T3 { background:var(--t3); color:#fff; }
.card-address { font-size:11px; color:var(--text2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.card-stage { font-size:10px; color:var(--text3); background:var(--bg); padding:2px 6px; border-radius:4px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-days { font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; }
.card-days.green { background:#166534; color:#86efac; }
.card-days.amber { background:#713f12; color:#fde047; }
.card-days.red { background:#7f1d1d; color:#fca5a5; }
.card-sawater { font-size:10px; color:#38bdf8; margin-top:3px; }
.card-fieldwork { font-size:10px; color:#ef4444; margin-top:3px; font-weight:600; display:flex; align-items:center; gap:3px; }
.card-fieldwork .fw-dot { width:6px; height:6px; border-radius:50%; background:#ef4444; animation:fwPulse 2s infinite; }
@keyframes fwPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.card-premium { font-size:10px; color:#a78bfa; margin-top:3px; font-weight:600; }
.card-stale { font-size:10px; color:#fbbf24; margin-top:3px; font-weight:600; display:flex; align-items:center; gap:3px; }
.badge-stale { font-size:9px; background:#92400e; color:#fde047; padding:1px 4px; border-radius:3px; font-weight:700; }
.badge-premium { font-size:9px; background:#5b21b6; color:#c4b5fd; padding:1px 4px; border-radius:3px; font-weight:700; }

/* List view */
.list-view { padding:12px 24px; }
.list-table { width:100%; border-collapse:collapse; font-size:13px; }
.list-table th { text-align:left; padding:8px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.list-table th:hover { color:var(--text); }
.list-table td { padding:8px 12px; border-bottom:1px solid rgba(71,85,105,.3); }
.list-table tr:hover td { background:var(--surface); }
.list-table .link { color:var(--accent); text-decoration:none; }
.list-table .link:hover { text-decoration:underline; }

/* Client View */
.client-view { padding:12px 24px; }
.client-group { background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; }
.client-group-header { padding:12px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background .2s; }
.client-group-header:hover { background:var(--surface2); }
.client-group-name { font-size:14px; font-weight:600; }
.client-group-count { font-size:12px; color:var(--text2); background:var(--surface2); padding:2px 10px; border-radius:10px; }
.client-group-body { display:none; padding:0 16px 12px; }
.client-group.open .client-group-body { display:block; }
.client-group-chevron { color:var(--text3); transition:transform .2s; font-size:12px; }
.client-group.open .client-group-chevron { transform:rotate(90deg); }
.client-project-row { display:flex; align-items:center; gap:12px; padding:6px 0; border-bottom:1px solid rgba(71,85,105,.2); font-size:13px; }
.client-project-row:last-child { border-bottom:none; }

/* RFI Tracker */
.rfi-view { padding:12px 24px; }
.rfi-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:8px; transition:border-color .2s; }
.rfi-card:hover { border-color:var(--accent); }
.rfi-card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.rfi-project { font-size:14px; font-weight:600; }
.rfi-urgency { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; }
.rfi-urgency.overdue { background:#7f1d1d; color:#fca5a5; }
.rfi-urgency.urgent { background:#92400e; color:#fde047; }
.rfi-urgency.normal { background:#1e3a5f; color:#93c5fd; }
.rfi-urgency.no-date { background:var(--surface2); color:var(--text2); }
.rfi-detail { font-size:12px; color:var(--text2); margin-top:4px; }
.rfi-detail strong { color:var(--text); }
.rfi-meta { display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; }
.rfi-meta-item { font-size:11px; color:var(--text3); }
.rfi-meta-item strong { color:var(--text2); }
.rfi-stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.rfi-stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; flex:1; min-width:100px; text-align:center; }
.rfi-stat .rfi-stat-val { font-size:22px; font-weight:700; }
.rfi-stat .rfi-stat-label { font-size:10px; color:var(--text3); text-transform:uppercase; }
.rfi-updated { font-size:11px; color:var(--text3); margin-bottom:12px; }

/* Activity Feed */
.activity-view { padding:12px 24px; }
.activity-empty { text-align:center; padding:40px; color:var(--text3); }
.activity-item { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid rgba(71,85,105,.2); }
.activity-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.activity-icon.stage { background:#1e3a5f; }
.activity-icon.resp { background:#3b1f5b; }
.activity-body { flex:1; }
.activity-title { font-size:13px; font-weight:500; }
.activity-title a { color:var(--accent); text-decoration:none; }
.activity-title a:hover { text-decoration:underline; }
.activity-change { font-size:12px; color:var(--text2); margin-top:2px; }
.activity-change .from { color:var(--red); text-decoration:line-through; opacity:.7; }
.activity-change .to { color:var(--green); font-weight:600; }
.activity-time { font-size:11px; color:var(--text3); margin-top:2px; }
.activity-updated { font-size:11px; color:var(--text3); margin-bottom:12px; }

/* Map tab */
#panel-map { padding:0; }
#panel-map.active { display:block; }

/* Panels */
.panel { display:none; }
.panel.active { display:block; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--text3); }

@media(max-width:768px) {
  .header { padding:10px 12px; }
  .filters { padding:8px 12px; }
  .stats-bar { padding:8px 12px; }
  .kanban { padding:8px 12px; }
  .list-view { padding:8px 12px; }
  .kanban-col { min-width:240px; flex:0 0 240px; }
  .search-box { width:160px; }
  .workload-donut-wrap { display:none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img class="logo" src="pennino_logo.png" alt="Pennino">
    <h1>Project Dashboard</h1>
  </div>
  <div class="header-right">
    <span class="refresh-badge" id="lastUpdated">Updated: loading...</span>
    <span id="projectCount"></span>
  </div>
</div>

<div class="nav">
  <div class="nav-tab active" data-tab="responsibility">&#x1F464; Responsibility</div>
  <div class="nav-tab" data-tab="stage">&#x1F4CB; Stage</div>
  <div class="nav-tab" data-tab="list">&#x1F4CA; List</div>
  <div class="nav-tab" data-tab="clients">&#x1F465; Clients</div>
  <div class="nav-tab" data-tab="rfi">&#x1F4E1; RFIs <span class="tab-badge" id="rfiBadge" style="display:none"></span></div>
  <div class="nav-tab" data-tab="activity">&#x1F4F0; Activity</div>
  <div class="nav-tab" data-tab="map">&#x1F5FA;&#xFE0F; Map</div>
</div>

<div class="filters" id="filtersBar">
  <div class="filter-btn active" data-filter="tier" data-value="all">All Tiers</div>
  <div class="filter-btn" data-filter="tier" data-value="T1">&#x1F535; T1 Survey</div>
  <div class="filter-btn" data-filter="tier" data-value="T2">&#x1F7E2; T2 Land Div</div>
  <div class="filter-btn" data-filter="tier" data-value="T3">&#x1F7E0; T3 Engineering</div>
  <div class="filter-sep"></div>
  <div class="filter-btn" data-filter="smart" data-value="fieldwork">&#x1F527; Field Work</div>
  <div class="filter-btn" data-filter="smart" data-value="authority">&#x1F3DB;&#xFE0F; With Authority</div>
  <div class="filter-btn" data-filter="smart" data-value="drafting">&#x270F;&#xFE0F; Drafting</div>
  <div class="filter-btn" data-filter="smart" data-value="premium">&#x1F48E; Premium</div>
  <div class="filter-btn" data-filter="smart" data-value="stale">&#x23F0; Stale</div>
  <div class="client-search-wrap">
    <input class="client-search" type="text" id="clientSearch" placeholder="&#x1F464; Filter by client..." autocomplete="off">
    <div class="client-suggestions" id="clientSuggestions"></div>
  </div>
  <input class="search-box" type="text" placeholder="&#x1F50D; Search projects..." id="searchBox">
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="workload-section" id="workloadSection">
  <div class="workload-toggle" id="workloadToggle">&#x25B6; Workload Summary</div>
  <div id="workloadContent" style="display:none;"></div>
</div>

<div class="bottleneck" id="bottleneckBar"></div>

<div class="panel active" id="panel-responsibility"></div>
<div class="panel" id="panel-stage"></div>
<div class="panel" id="panel-list"></div>
<div class="panel" id="panel-clients"></div>
<div class="panel" id="panel-rfi"></div>
<div class="panel" id="panel-activity"></div>
<div class="panel" id="panel-map">
  <iframe id="mapFrame" src="about:blank" style="width:100%;height:calc(100vh - 100px);border:none;border-radius:8px;margin:0;"></iframe>
</div>

<script>
let PROJECTS = [];
let RFI_DATA = null;
let ACTIVITY_DATA = null;

// Stale thresholds (days) per stage name
const STALE_THRESHOLDS = {
  "Prepare Project":7, "Field Work Scheduled":14, "Prepare Plan":14,
  "Send Plan to Client":7, "Invoice":7,
  "1. Concept Planning":14, "Concept Planning":14,
  "2. PlanSA Lodgement":30, "PlanSA Lodgement":30,
  "3. Authority Assessment":60, "Authority Assessment":60,
  "4. Conditions & Compliance":30, "Conditions & Compliance":30,
  "5. Certified Survey":21, "Certified Survey":21,
  "6. Land Division Certificate Lodged with PlanSA":30, "Land Division Certificate Lodged with PlanSA":30,
  "7. SCAP Application":60, "SCAP Application":60,
  "8. Final Authority Approvals":60, "Final Authority Approvals":60,
  "9. LTO Lodgement":30, "LTO Lodgement":30,
  "10. LTO Approval":60, "LTO Approval":60,
  "11. Complete":7, "Complete":7,
  "Search & DBYD":7, "Plan Drawing & Check":14, "Plan to Client":7,
  "Further Work Required":30, "Invoice & Close":7
};

function isStale(p) {
  const threshold = STALE_THRESHOLDS[p.stage_name];
  if (threshold === undefined) return false;
  return (p.days_in_stage || 0) >= threshold;
}

const INSIGHTLY_BASE = "https://crm.na1.insightly.com/details/project/";

let currentTab = "responsibility";
let tierFilter = "all";
let smartFilter = null;
let searchTerm = "";
let clientFilter = "";

const RESP_ORDER = ["AR (Alex)", "DP (Damiano)", "TR (Tristan)", "Harry", "Grant", "Kate (Drafting)", "Client", "Contractor", "Council/Authority", "SA Water", "LTO", "SCAP/DAC", ""];
const RESP_COLORS = {
  "AR (Alex)":"#2D6DA5", "DP (Damiano)":"#ec4899", "TR (Tristan)":"#14b8a6",
  "Harry":"#f97316", "Grant":"#84cc16", "Kate (Drafting)":"#a78bfa",
  "Client":"#f59e0b", "Contractor":"#78716c", "Council/Authority":"#3b82f6",
  "SA Water":"#38bdf8", "LTO":"#f97316", "SCAP/DAC":"#ef4444", "":"#475569"
};
const RESP_LABELS = { "": "Unassigned" };
function respLabel(r) { return RESP_LABELS[r] || r; }

function matchesSmart(p, filter) {
  if (!filter) return true;
  const sn = (p.stage_name || "").toLowerCase();
  const rn = (p.responsibility || "").toLowerCase();
  switch(filter) {
    case "fieldwork": return sn.includes("field work") || sn.includes("pegging") || sn.includes("certified survey") || p.needs_fieldwork === true;
    case "authority": return sn.includes("authority") || sn.includes("plansa") || sn.includes("scap") || sn.includes("lto") || rn.includes("council") || rn.includes("scap") || rn.includes("lto");
    case "drafting": return sn.includes("plan drawing") || sn.includes("prepare plan") || sn.includes("drafting") || sn.includes("concept") || rn.includes("kate");
    case "premium": return p.is_premium === true;
    case "stale": return isStale(p);
    default: return true;
  }
}

function filteredProjects() {
  return PROJECTS.filter(p => {
    if (tierFilter !== "all" && p.tier !== tierFilter) return false;
    if (!matchesSmart(p, smartFilter)) return false;
    if (clientFilter && (p.client || "") !== clientFilter) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      return (p.name||"").toLowerCase().includes(s) || (p.address||"").toLowerCase().includes(s) || (p.client||"").toLowerCase().includes(s);
    }
    return true;
  });
}

function daysClass(d) {
  if (d === null || d === undefined) return "";
  if (d < 7) return "green";
  if (d < 14) return "amber";
  return "red";
}

function makeCard(p) {
  const dc = daysClass(p.days_in_stage);
  const daysHtml = p.days_in_stage !== null ? `<span class="card-days ${dc}">${p.days_in_stage}d</span>` : "";
  const clientHtml = p.client ? `<div class="card-sawater">\u{1F464} ${p.client}</div>` : "";
  const fwHtml = p.needs_fieldwork ? `<div class="card-fieldwork"><span class="fw-dot"></span>\u{1F527} Field Work</div>` : "";
  const premiumHtml = p.is_premium ? `<div class="card-premium">\u{1F48E} Premium</div>` : "";
  const staleHtml = isStale(p) ? `<div class="card-stale">\u{23F0} Stale (${STALE_THRESHOLDS[p.stage_name]}d threshold)</div>` : "";
  let badgeHtml = "";
  if (isStale(p)) badgeHtml += `<span class="badge-stale">\u{23F0}</span>`;
  if (p.is_premium) badgeHtml += `<span class="badge-premium">\u{1F48E}</span>`;

  return `<a href="${INSIGHTLY_BASE}${p.id}" target="_blank" style="text-decoration:none;color:inherit;" title="Open in Insightly">
    <div class="card">
      <div class="card-header">
        <span class="card-name">${p.name}</span>
        <div class="card-badges">${badgeHtml}<span class="card-tier ${p.tier}">${p.tier}</span></div>
      </div>
      <div class="card-address" title="${p.address||''}">${p.address || "No address"}</div>

function renderWorkload(fp) {
  if (fp.length === 0) return;
  const counts = {};
  fp.forEach(p => { const r = p.responsibility || ""; counts[r] = (counts[r]||0) + 1; });
  const maxCount = Math.max(...Object.values(counts), 1);

  // Bar chart
  let bars = "";
  RESP_ORDER.forEach(r => {
    if (!counts[r]) return;
    const pct = (counts[r] / maxCount * 100);
    const col = RESP_COLORS[r] || "#475569";
    bars += `<div class="workload-bar-row">
      <span class="workload-bar-label">${respLabel(r)}</span>
      <div class="workload-bar-track">
        <div class="workload-bar-fill" style="width:${pct}%;background:${col}">${counts[r]}</div>
      </div>
    </div>`;
  });
  // Catch-all for unlisted
  Object.keys(counts).forEach(r => {
    if (RESP_ORDER.includes(r)) return;
    const pct = (counts[r] / maxCount * 100);
    bars += `<div class="workload-bar-row">
      <span class="workload-bar-label">${respLabel(r)}</span>
      <div class="workload-bar-track">
        <div class="workload-bar-fill" style="width:${pct}%;background:#94a3b8">${counts[r]}</div>
      </div>
    </div>`;
  });

  // Donut chart (SVG)
  const entries = RESP_ORDER.filter(r => counts[r]).map(r => ({label:respLabel(r), count:counts[r], color:RESP_COLORS[r]||"#475569"}));
  const radius = 52, cx = 70, cy = 70, circumference = 2 * Math.PI * radius;
  let offset = 0;
  let circles = "";
  entries.forEach(e => {
    const pct = e.count / fp.length;
    const dash = circumference * pct;
    const gap = circumference - dash;
    circles += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${e.color}" stroke-width="16" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
  });

  document.getElementById("workloadContent").innerHTML = `<div class="workload-chart">
    <div class="workload-bars">${bars}</div>
    <div class="workload-donut-wrap">
      <div class="workload-donut">
        <svg width="140" height="140">${circles}</svg>
        <div class="workload-donut-center"><div class="big">${fp.length}</div><div class="small">ACTIVE</div></div>
      </div>
    </div>
  </div>`;
}

function renderBottleneck(fp) {
  if (fp.length === 0) { document.getElementById("bottleneckBar").innerHTML = ""; return; }
  const counts = {};
  fp.forEach(p => { const r = p.responsibility || ""; counts[r] = (counts[r]||0) + 1; });
  let segs = "";
  RESP_ORDER.forEach(r => {
    if (!counts[r]) return;
    const pct = (counts[r] / fp.length * 100);
    if (pct < 2) return;
    const col = RESP_COLORS[r] || "#475569";
    segs += `<div class="bottleneck-seg" style="width:${pct}%;background:${col}" title="${respLabel(r)}: ${counts[r]}">${pct > 6 ? respLabel(r) + " " + counts[r] : counts[r]}</div>`;
  });
  document.getElementById("bottleneckBar").innerHTML = `
    <div class="bottleneck-title">Responsibility Distribution</div>
    <div class="bottleneck-bar">${segs}</div>
  `;
}

function renderKanbanByResp(fp) {
  const groups = {};
  RESP_ORDER.forEach(r => groups[r] = []);
  fp.forEach(p => {
    const r = p.responsibility || "";
    if (!groups[r]) groups[r] = [];
    groups[r].push(p);
  });
  let cols = "";
  RESP_ORDER.forEach(r => {
    if (!groups[r] || groups[r].length === 0) return;
    const col = RESP_COLORS[r] || "#475569";
    const cards = groups[r].sort((a,b) => (b.days_in_stage||0) - (a.days_in_stage||0)).map(makeCard).join("");
    cols += `<div class="kanban-col">
      <div class="kanban-col-header" style="border-left:3px solid ${col}">
        <span class="kanban-col-title">${respLabel(r)}</span>
        <span class="kanban-col-count">${groups[r].length}</span>
      </div>
      <div class="kanban-cards">${cards}</div>
    </div>`;
  });
  Object.keys(groups).forEach(r => {
    if (RESP_ORDER.includes(r)) return;
    if (!groups[r] || groups[r].length === 0) return;
    const col = "#94a3b8";
    const cards = groups[r].sort((a,b) => (b.days_in_stage||0) - (a.days_in_stage||0)).map(makeCard).join("");
    cols += `<div class="kanban-col">
      <div class="kanban-col-header" style="border-left:3px solid ${col}">
        <span class="kanban-col-title">${respLabel(r)}</span>
        <span class="kanban-col-count">${groups[r].length}</span>
      </div>
      <div class="kanban-cards">${cards}</div>
    </div>`;

function renderKanbanByStage(fp) {
  const tiers = ["T1", "T2", "T3"];
  let allCols = "";
  tiers.forEach(tier => {
    const tierProjects = fp.filter(p => p.tier === tier);
    if (tierProjects.length === 0) return;
    const stageGroups = {};
    tierProjects.forEach(p => {
      const key = p.stage_name || "Unknown";
      if (!stageGroups[key]) stageGroups[key] = { projects: [], order: p.stage_order };
      stageGroups[key].projects.push(p);
    });
    const sorted = Object.entries(stageGroups).sort((a,b) => a[1].order - b[1].order);
    const tierColor = tier === "T1" ? "var(--t1)" : tier === "T2" ? "var(--t2)" : "var(--t3)";
    sorted.forEach(([stage, data]) => {
      const cards = data.projects.sort((a,b) => (b.days_in_stage||0) - (a.days_in_stage||0)).map(makeCard).join("");
      allCols += `<div class="kanban-col">
        <div class="kanban-col-header" style="border-left:3px solid ${tierColor}">
          <span class="kanban-col-title" title="${stage}">${tier}: ${stage.length > 22 ? stage.slice(0,20)+"\u2026" : stage}</span>
          <span class="kanban-col-count">${data.projects.length}</span>
        </div>
        <div class="kanban-cards">${cards}</div>
      </div>`;
    });
  });
  document.getElementById("panel-stage").innerHTML = `<div class="kanban">${allCols}</div>`;
}

function renderListView(fp) {
  let sortCol = "name";
  let sortDir = 1;
  function render() {
    const sorted = [...fp].sort((a,b) => {
      let va = a[sortCol] || "", vb = b[sortCol] || "";
      if (sortCol === "days_in_stage") { va = a.days_in_stage ?? -1; vb = b.days_in_stage ?? -1; return (va - vb) * sortDir; }
      return String(va).localeCompare(String(vb)) * sortDir;
    });
    const rows = sorted.map(p => {
      const dc = daysClass(p.days_in_stage);
      const daysHtml = p.days_in_stage !== null ? `<span class="card-days ${dc}">${p.days_in_stage}d</span>` : "-";
      const badges = (isStale(p) ? '\u{23F0} ' : '') + (p.is_premium ? '\u{1F48E} ' : '') + (p.needs_fieldwork ? '\u{1F527}' : '');
      return `<tr>
        <td><a class="link" href="${INSIGHTLY_BASE}${p.id}" target="_blank">${p.name}</a></td>
        <td><span class="card-tier ${p.tier}" style="font-size:11px">${p.tier}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.address||''}">${p.address || "-"}</td>
        <td>${p.stage_name}</td>
        <td>${respLabel(p.responsibility || "")}</td>
        <td>${daysHtml}</td>
        <td style="color:#38bdf8">${p.client || "-"}</td>
        <td>${badges}</td>
      </tr>`;
    }).join("");
    const arrow = (col) => sortCol === col ? (sortDir === 1 ? " \u25B2" : " \u25BC") : "";
    document.getElementById("panel-list").innerHTML = `<div class="list-view"><table class="list-table">
      <thead><tr>
        <th data-col="name">Project${arrow("name")}</th>
        <th data-col="tier">Tier${arrow("tier")}</th>
        <th data-col="address">Address${arrow("address")}</th>
        <th data-col="stage_name">Stage${arrow("stage_name")}</th>
        <th data-col="responsibility">Resp${arrow("responsibility")}</th>
        <th data-col="days_in_stage">Days${arrow("days_in_stage")}</th>
        <th>Client</th>
        <th>Flags</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
    document.querySelectorAll("#panel-list th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
        render();
      });
    });
  }
  render();
}

function renderRFIView() {
  if (!RFI_DATA || !RFI_DATA.rfis) {
    document.getElementById("panel-rfi").innerHTML = '<div class="rfi-view"><div class="activity-empty">\u{1F4E1} RFI data loading...</div></div>';
    return;
  }
  const rfis = RFI_DATA.rfis.filter(r => r.status !== "resolved");
  const now = new Date();

  function urgency(r) {
    if (!r.due_date_iso) return {cls:"no-date", label:"No Due Date", days:null};
    const due = new Date(r.due_date_iso + "T00:00:00");
    const diff = Math.ceil((due - now) / 86400000);
    if (diff < 0) return {cls:"overdue", label:`${Math.abs(diff)}d OVERDUE`, days:diff};
    if (diff <= 14) return {cls:"urgent", label:`${diff}d left`, days:diff};
    return {cls:"normal", label:`${diff}d left`, days:diff};
  }

  // Sort: overdue first, then by days remaining
  const sorted = [...rfis].sort((a,b) => {
    const ua = urgency(a), ub = urgency(b);
    if (ua.days === null) return 1;
    if (ub.days === null) return -1;
    return ua.days - ub.days;
  });

  const overdue = sorted.filter(r => urgency(r).cls === "overdue").length;
  const urgent = sorted.filter(r => urgency(r).cls === "urgent").length;
  const noDue = sorted.filter(r => urgency(r).cls === "no-date").length;

  let html = '<div class="rfi-view">';
  if (RFI_DATA.last_updated) {
    const d = new Date(RFI_DATA.last_updated);
    html += `<div class="rfi-updated">\u{1F4E1} RFI data last updated: ${d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Australia/Adelaide'})}</div>`;
  }

  html += `<div class="rfi-stats">
    <div class="rfi-stat"><div class="rfi-stat-val">${sorted.length}</div><div class="rfi-stat-label">Active RFIs</div></div>
    <div class="rfi-stat"><div class="rfi-stat-val" style="color:var(--red)">${overdue}</div><div class="rfi-stat-label">Overdue</div></div>
    <div class="rfi-stat"><div class="rfi-stat-val" style="color:var(--amber)">${urgent}</div><div class="rfi-stat-label">Due \u226414 days</div></div>
    <div class="rfi-stat"><div class="rfi-stat-val" style="color:var(--text3)">${noDue}</div><div class="rfi-stat-label">No Due Date</div></div>
  </div>`;

  sorted.forEach(r => {
    const u = urgency(r);
    const link = r.insightly_id ? `<a href="${INSIGHTLY_BASE}${r.insightly_id}" target="_blank" style="color:var(--accent);text-decoration:none">${r.project_name || r.project_ref}</a>` : (r.project_name || r.project_ref);
    html += `<div class="rfi-card">
      <div class="rfi-card-header">
        <div>
          <div class="rfi-project">${link}</div>
          <div class="rfi-detail">${r.description || ""}</div>
        </div>
        <span class="rfi-urgency ${u.cls}">${u.label}</span>
      </div>
      <div class="rfi-meta">
        <div class="rfi-meta-item"><strong>Authority:</strong> ${r.authority || "-"}</div>
        <div class="rfi-meta-item"><strong>Location:</strong> ${r.location || "-"}</div>
        <div class="rfi-meta-item"><strong>PlanSA ID:</strong> ${r.app_id || "-"}</div>
        <div class="rfi-meta-item"><strong>Type:</strong> ${r.type || "RFI"}</div>
        ${r.due_date_iso ? `<div class="rfi-meta-item"><strong>Due:</strong> ${new Date(r.due_date_iso+"T00:00:00").toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</div>` : ''}
      </div>
    </div>`;
  });

  html += '</div>';
  document.getElementById("panel-rfi").innerHTML = html;
}

// Data loading
async function loadData() {
  try {
    const resp = await fetch('data.json?' + Date.now());
    const data = await resp.json();
    PROJECTS = data.projects;
    if (window._updateClientList) window._updateClientList(PROJECTS);
    const lu = document.getElementById('lastUpdated');
    if (lu && data.last_updated) {
      const d = new Date(data.last_updated);
      const now = new Date();
      const diffMin = Math.round((now - d) / 60000);
      let ago;
      if (diffMin < 1) ago = 'just now';
      else if (diffMin < 60) ago = diffMin + ' min ago';
      else if (diffMin < 1440) ago = Math.round(diffMin/60) + 'h ago';
      else ago = d.toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'numeric'});
      lu.textContent = 'Updated ' + ago;
      lu.title = d.toLocaleString('en-AU', {timeZone:'Australia/Adelaide'});
    }
    renderAll();
  } catch(e) {
    console.error('Failed to load data:', e);
    const lu = document.getElementById('lastUpdated');
    if (lu) lu.textContent = 'Data load failed';
  }
}

// Client search autocomplete
(function() {
  const input = document.getElementById("clientSearch");
  const sugBox = document.getElementById("clientSuggestions");
  let allClients = [];
  window._updateClientList = function(projects) {
    allClients = [...new Set(projects.map(p => p.client || '').filter(c => c))].sort();
  };
  function showSuggestions(filter) {
    const q = filter.toLowerCase();
    const matches = q ? allClients.filter(c => c.toLowerCase().includes(q)) : allClients;
    sugBox.innerHTML = '<div class="client-sug-clear">\u2715 Clear filter</div>' +
      matches.map(c => `<div class="client-sug-item">${c}</div>`).join('');
    sugBox.classList.add('show');
    sugBox.querySelector('.client-sug-clear').onclick = () => {
      input.value = ''; clientFilter = ''; sugBox.classList.remove('show'); renderAll();
    };
    sugBox.querySelectorAll('.client-sug-item').forEach(el => {
      el.onclick = () => {
        input.value = el.textContent; clientFilter = el.textContent;
        sugBox.classList.remove('show'); renderAll();
      };
    });
  }
  input.addEventListener('focus', () => showSuggestions(input.value));
  input.addEventListener('input', (e) => {
    showSuggestions(e.target.value);
    clientFilter = '';
    const q = e.target.value.toLowerCase();
    if (q && allClients.some(c => c.toLowerCase() === q)) clientFilter = allClients.find(c => c.toLowerCase() === q);
    renderAll();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.client-search-wrap')) sugBox.classList.remove('show');
  });
})();

// Search
document.getElementById("searchBox").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  renderAll();
});

// Workload toggle
document.getElementById("workloadToggle").addEventListener("click", () => {
  const content = document.getElementById("workloadContent");
  const toggle = document.getElementById("workloadToggle");
  if (content.style.display === "none") {
    content.style.display = "block";
    toggle.innerHTML = "\u25BC Workload Summary";
  } else {
    content.style.display = "none";
    toggle.innerHTML = "\u25B6 Workload Summary";
  }
});

// Initial load
loadData();
loadRFIs();
loadActivity();

// Auto-refresh
setInterval(() => { loadData(); loadRFIs(); loadActivity(); }, 15 * 60 * 1000);
</script>
</body>
</html>
