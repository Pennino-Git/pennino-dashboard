name: Refresh Dashboard Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch Insightly data
        env:
          INSIGHTLY_API_KEY: ${{ secrets.INSIGHTLY_API_KEY }}
        run: python scripts/fetch-data.py

      - name: Commit and push if changed
        run: |
          git config user.name "Pennino Dashboard Bot"
          git config user.email "office@pennino.com.au"
          git add data.json stage_tracking.json
          git diff --cached --quiet || (git commit -m "📊 Auto-refresh dashboard data $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git pull --rebase origin main && git push)
