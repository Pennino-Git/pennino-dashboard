name: Refresh Dashboard Data

on:
  schedule:
    # Every 15 minutes during Adelaide business hours (Mon-Fri 7:30am-6:30pm ACST = 10pm-9am UTC prev day)
    # Simplified: run every 15 min, the script itself is fast
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Fetch Insightly data
        env:
          INSIGHTLY_API_KEY: ${{ secrets.INSIGHTLY_API_KEY }}
        run: python scripts/fetch-data.py
      
      - name: Commit and push if changed
        run: |
          git config user.name "Pennino Dashboard Bot"
          git config user.email "office@pennino.com.au"
          git add data.json
          git diff --cached --quiet || (git commit -m "📊 Auto-refresh dashboard data $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
